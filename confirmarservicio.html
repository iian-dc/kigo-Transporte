<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Buscando conductor - Kigo xpress</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff}
.app{max-width:500px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;position:relative}
.top{position:absolute;top:0;left:0;right:0;padding:18px;text-align:center;font-weight:900;font-size:16px}
.spinner{width:60px;height:60px;border:5px solid #eee;border-top:5px solid #FFC100;border-radius:50%;margin:22px auto 10px;animation:girar 0.8s linear infinite}
@keyframes girar{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.resumen{margin-top:16px;background:#f7f7f8;border-radius:16px;padding:14px;width:100%;text-align:left;font-size:13px;line-height:1.6}
.conectando{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:#999;margin-top:14px}
.mini-carga{width:18px;height:18px;border:2px solid #eee;border-top:2px solid #25D366;border-radius:50%;animation:girar 0.7s linear infinite;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
<div class="top">Buscando conductor...</div>
<div class="spinner"></div>
<div style="font-weight:900;font-size:18px">Tu viaje ya quedó listo</div>
<div style="font-size:13px;color:#666;margin-top:4px">Estamos buscando un conductor cerca de ti...</div>
<div class="resumen" id="resumenTxt">Cargando tu viaje...</div>
<div class="conectando"><span>Te estamos conectando con WhatsApp</span><span class="mini-carga"></span></div>
</div>
<script>
var datosViaje = null;
try { datosViaje = JSON.parse(localStorage.getItem('kigo_viaje_pendiente') || 'null'); } catch(e) { datosViaje = null; }
if (!datosViaje) {
datosViaje = {origen:"Plaza Principal, Dolores Hidalgo", destino:"Parroquia Dolores Hidalgo", origenLat:21.1561, origenLng:-100.9333, destLat:21.1578, destLng:-100.9345, distKm:"1.20", precio:35, tipo:"moto"};
}
var tipo = localStorage.getItem('kigo_tipo_seleccionado') || datosViaje.tipo || "moto";
var tipoTexto = (tipo === 'carro' ? 'Carro' : 'Moto');
var linkRecogida = "https://www.google.com/maps/search/?api=1&query=" + datosViaje.origenLat + "," + datosViaje.origenLng;
var linkEntrega = "https://www.google.com/maps/search/?api=1&query=" + datosViaje.destLat + "," + datosViaje.destLng;
var linkRuta = "https://www.google.com/maps/dir/" + datosViaje.origenLat + "," + datosViaje.origenLng + "/" + datosViaje.destLat + "," + datosViaje.destLng;
document.getElementById('resumenTxt').innerHTML = "<b>Vehiculo:</b> " + tipoTexto + "<br><b>Recogida:</b> " + datosViaje.origen + "<br><b>Entrega:</b> " + datosViaje.destino + "<br><b>Distancia:</b> " + datosViaje.distKm + " km<br><b>Valor del servicio:</b> $" + datosViaje.precio + " MXN";
var mensaje = "🚖 *Kigo Transporte* 🚖\n\n*NUEVO SERVICIO*\n\n📍 *¿Dónde se va a recoger?*\n" + datosViaje.origen + "\n" + linkRecogida + "\n\n🏁 *¿Dónde se va a llevar?*\n" + datosViaje.destino + "\n" + linkEntrega + "\n\n🗺️ *Ruta:*\n" + linkRuta + "\n\n🚗 *Vehículo:* " + tipoTexto + "\n📏 *Distancia:* " + datosViaje.distKm + " km\n💰 *Valor del servicio:* $" + datosViaje.precio + " MXN\n\n¿Disponible para tomarlo?";
var numeroWhatsApp = "524182371993";
var urlWhatsApp = "https://wa.me/" + numeroWhatsApp + "?text=" + encodeURIComponent(mensaje);
setTimeout(function(){ window.location.href = urlWhatsApp; }, 5000);
</script>
</body>
</html>
